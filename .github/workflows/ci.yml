name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Retain headroom when a newly pinned dependency is not cached yet.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Nix exports Bash 4+ syntax; macOS ships Bash 3.2. Bootstrap from our pin.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare user cache directory
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore Nix store and source cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
      - name: Select pinned Bash for macOS
        if: runner.os == 'macOS'
        run: |
          bash_path=$(nix-build ./nix --attr bash --no-out-link)
          echo "$bash_path/bin" >> "$GITHUB_PATH"
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          cache: devenv
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-
      - name: Build preview app without release credentials
        if: runner.os == 'macOS'
        run: PASSLET_BUILD_MODE=unsigned ./scripts/build-macos.sh
      - name: Archive app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/unsigned/Passlet.app build/Passlet-macOS-preview.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: build/Passlet-macOS-preview.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate workflows, shell scripts, and tracked secrets
        if: runner.os == 'Linux'
        run: lint
      - name: Test Swift helper and menu
        if: runner.os == 'macOS'
        run: ./scripts/check-macos.sh --tests-only
      - run: make check
      - run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: build/coverage.txt
          retention-days: 14

  integration:
    name: NixOS SSH integration
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare user cache directory
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore shared Linux Nix cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
          save: false
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          cache: devenv
      - name: Enable KVM for the Nix build users
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - run: make integration
