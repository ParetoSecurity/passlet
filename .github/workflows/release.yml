name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: passlet-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      prepare: ${{ steps.verify.outputs.prepare }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: Verify preparation PR or published source
        env:
          PASSLET_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import os, re
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)(-prepare)?", os.environ["PASSLET_TAG"])
          assert match, "Expected vX.Y.Z or vX.Y.Z-prepare"
          print(f"version={match[1]}")
          print(f"prepare={'true' if match[2] else 'false'}")
          PYTHON
          sha=$(git rev-parse "refs/tags/$PASSLET_TAG^{commit}")
          if [[ "$PASSLET_TAG" == *-prepare ]]; then
            gh api "repos/$GH_REPO/commits/$sha/pulls" > "$RUNNER_TEMP/preparation-prs.json"
            gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=1" > "$RUNNER_TEMP/preparation-ci.json"
            python3 scripts/verify-preparation.py "$sha" "$RUNNER_TEMP/preparation-prs.json" "$RUNNER_TEMP/preparation-ci.json"
          else
            git merge-base --is-ancestor "$sha" origin/main
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  prepare:
    if: needs.verify.outputs.prepare == 'true'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    env:
      PASSLET_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      # Nix exports Bash 4+ syntax; macOS ships Bash 3.2. Bootstrap from our pin.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Select pinned Bash for macOS
        run: |
          bash_path=$(nix-build ./nix --attr bash --no-out-link)
          echo "$bash_path/bin" >> "$GITHUB_PATH"
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Import Developer ID certificate and profile
        env:
          APPLICATION_CERTIFICATE_DATA: ${{ secrets.APPLICATION_CERTIFICATE_DATA }}
          APPLICATION_CERTIFICATE_PASSPHRASE: ${{ secrets.APPLICATION_CERTIFICATE_PASSPHRASE }}
          PROVISIONING_PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_DATA }}
        run: |
          set -eu
          umask 077
          keychain="$RUNNER_TEMP/passlet-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$APPLICATION_CERTIFICATE_DATA" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$PROVISIONING_PROFILE_DATA" | base64 --decode > "$RUNNER_TEMP/passlet.provisionprofile"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLICATION_CERTIFICATE_PASSPHRASE" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          echo "PASSLET_PROVISIONING_PROFILE=$RUNNER_TEMP/passlet.provisionprofile" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify
        env:
          PASSLET_SIGNING_IDENTITY: ${{ vars.PASSLET_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: make release
      - name: Record preparation provenance
        run: python3 scripts/package-release.py "$PASSLET_VERSION" dist build/package-updates --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"
      - name: Save signed release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passlet-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload package metadata for the release PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: passlet-package-updates
          path: build/package-updates/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/passlet-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/passlet.provisionprofile"

  publish:
    if: needs.verify.outputs.prepare == 'false'
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      PASSLET_TAG: ${{ github.ref_name }}
      PASSLET_VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Download and verify prepared artifacts against tagged metadata
        run: |
          run_id=$(python3 -c 'import json; value=json.load(open("packaging/release.json"))["preparation"]["run_id"]; assert type(value) is int and value > 0; print(value)')
          gh api "repos/$GH_REPO/actions/runs/$run_id" > "$RUNNER_TEMP/preparation-run.json"
          gh run download "$run_id" --name passlet-release-assets --dir "$RUNNER_TEMP/prepared"
          python3 scripts/verify-release.py "$PASSLET_VERSION" "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/preparation-run.json"
      - name: Publish the verified release
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git fetch --no-tags origin "refs/tags/$PASSLET_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$VERIFIED_SHA"
          gh release create "$PASSLET_TAG" --draft --verify-tag --title "$PASSLET_TAG" --generate-notes
          gh release upload "$PASSLET_TAG" "$RUNNER_TEMP/prepared/"*
          gh release edit "$PASSLET_TAG" --draft=false
