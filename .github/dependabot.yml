version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    open-pull-requests-limit: 0 # Version updates are bundled by the ops Sunday updater.
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0 # Version updates are bundled by the ops Sunday updater.
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
