name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nix exports Bash 4+ syntax; macOS ships Bash 3.2. Bootstrap from our pin.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: runner.os == 'macOS'
      - name: Select pinned Bash for macOS
        if: runner.os == 'macOS'
        run: |
          bash_path=$(nix-build ./nix --attr bash --no-out-link)
          echo "$bash_path/bin" >> "$GITHUB_PATH"
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: make check
      - run: make build
      - name: Compile Swift helper without credentials
        if: runner.os == 'macOS'
        run: |
          if ! /usr/bin/xcrun --find swiftc >/dev/null 2>&1; then
            export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          fi
          unset SDKROOT
          SDKROOT="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          /usr/bin/xcrun swiftc -sdk "$SDKROOT" -target "$(uname -m)-apple-macosx14.0" -swift-version 5 macos/main.swift -o build/PassletHelper -framework AppKit -framework Security -framework LocalAuthentication
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: build/coverage.txt
          retention-days: 14

  quality:
    name: Workflow and secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate workflows, shell scripts, and tracked secrets
        run: lint
