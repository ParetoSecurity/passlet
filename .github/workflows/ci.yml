name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    # Retain headroom when a newly pinned dependency is not cached yet.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os == 'Linux'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare user cache directory
        if: runner.os == 'Linux'
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore Nix store and source cache
        if: runner.os == 'Linux'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
      - if: runner.os == 'Linux'
        uses: teamniteo/gha-actions/nix@4bddff5a20baab8eef4c2f8fbf96e008d8d9c46f # v44
        with:
          cache: devenv
      - if: runner.os == 'macOS'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-
      - name: Build preview app without release credentials
        if: runner.os == 'macOS'
        run: PASSLET_BUILD_MODE=unsigned ./scripts/build-macos.sh
      - name: Archive app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/unsigned/Passlet.app build/Passlet-macOS-preview.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: build/Passlet-macOS-preview.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate workflows, shell scripts, and tracked secrets
        if: runner.os == 'Linux'
        run: lint
      - name: Test Swift helper
        if: runner.os == 'macOS'
        run: ./scripts/check-macos.sh --tests-only
      - name: Validate package-manager configuration
        if: runner.os == 'Linux'
        run: nix-build nix/packaging-tests.nix --no-out-link
      - if: runner.os == 'Linux'
        run: make check
      - if: runner.os == 'macOS'
        run: ./scripts/check.sh --tests-only
      - run: make build
      - name: Verify installed package artifacts
        if: runner.os == 'Linux'
        run: ./scripts/check-package-artifact.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: build/coverage.txt
          retention-days: 14

  macos-package:
    name: Test macOS Nix package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Build package fixture without release credentials
        run: PASSLET_BUILD_MODE=unsigned ./scripts/build-macos.sh
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Validate package-manager configuration
        run: nix-build nix/packaging-tests.nix --no-out-link
      - name: Verify installed package artifacts
        run: ./scripts/check-package-artifact.sh

  integration:
    name: NixOS SSH integration
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare user cache directory
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore shared Linux Nix cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v1-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
          save: false
      - uses: teamniteo/gha-actions/nix@4bddff5a20baab8eef4c2f8fbf96e008d8d9c46f # v44
        with:
          cache: devenv
      - name: Enable KVM for the Nix build users
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - run: make integration
