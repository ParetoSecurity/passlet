name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.verify.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-metadata.py >> "$GITHUB_OUTPUT"

  required:
    name: ${{ matrix.check }}
    needs: [integration, macos-package, metadata, test]
    if: always()
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        check:
          - NixOS SSH integration
          - Test (macos-26)
          - Test (ubuntu-26.04)
          - Test macOS Nix package
    steps:
      - env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          VERIFIED: ${{ needs.metadata.outputs.verified }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.macos-package.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$METADATA_RESULT" = success
          if [ "$VERIFIED" != true ]; then
            test "$VERIFIED" = false
            test "$TEST_RESULT" = success
            test "$PACKAGE_RESULT" = success
            test "$INTEGRATION_RESULT" = success
          fi

  test:
    needs: metadata
    if: needs.metadata.outputs.verified != 'true'
    name: Full tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    # Retain headroom when a newly pinned dependency is not cached yet.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v31.11.5
      - name: Prepare user cache directory
        if: runner.os == 'Linux'
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore Nix store and source cache
        if: runner.os == 'Linux'
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
      - if: runner.os == 'Linux'
        uses: teamniteo/gha-actions/nix@v46
        with:
          cache: devenv
      - if: runner.os == 'macOS'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and build cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'go.mod', 'go.sum') }}-
      - name: Build preview app without release credentials
        if: runner.os == 'macOS'
        run: PASSLET_BUILD_MODE=unsigned ./scripts/build-macos.sh
      - name: Archive app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/unsigned/Passlet.app build/Passlet-macOS-preview.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: false
          path: build/Passlet-macOS-preview.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate workflows, shell scripts, and tracked secrets
        if: runner.os == 'Linux'
        run: lint
      - name: Test Swift helper
        if: runner.os == 'macOS'
        run: ./scripts/check-macos.sh
      - name: Validate package-manager configuration
        if: runner.os == 'Linux'
        run: nix-build nix/packaging-tests.nix --no-out-link
      - if: runner.os == 'Linux'
        run: make check
      - if: runner.os == 'macOS'
        run: ./scripts/check.sh --tests-only
      - run: make build
      - name: Verify installed package artifacts
        if: runner.os == 'Linux'
        run: ./scripts/check-package-artifact.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: build/coverage.txt
          retention-days: 14

  macos-package:
    needs: metadata
    if: needs.metadata.outputs.verified != 'true'
    name: Full macOS Nix package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - name: Build package fixture without release credentials
        run: PASSLET_BUILD_MODE=unsigned ./scripts/build-macos.sh
      - uses: cachix/install-nix-action@v31.11.5
      - name: Validate package-manager configuration
        run: nix-build nix/packaging-tests.nix --no-out-link
      - name: Verify installed package artifacts
        run: ./scripts/check-package-artifact.sh

  integration:
    needs: metadata
    if: needs.metadata.outputs.verified != 'true'
    name: Full NixOS SSH integration
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.5
      - name: Prepare user cache directory
        run: mkdir -p "$HOME/.cache/nix"
      - name: Restore shared Linux Nix cache
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-v1-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('nix/flake.lock', 'nix/*.nix', 'default.nix', 'shell.nix', 'devenv.nix') }}
          paths: ~/.cache/nix
          save: false
      - uses: teamniteo/gha-actions/nix@v46
        with:
          cache: devenv
      - name: Enable KVM for the Nix build users
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - run: make integration
