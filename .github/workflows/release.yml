name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: passlet-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
      - id: verify
        name: Verify release commit and maintainer agreement before signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PASSLET_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["PASSLET_TAG"])'
          sha=$(git rev-parse "refs/tags/$PASSLET_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          python3 scripts/review-quorum.py --repo "$GH_REPO" --release-sha "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  release:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      PASSLET_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}
      # Nix exports Bash 4+ syntax; macOS ships Bash 3.2. Bootstrap from our pin.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Select pinned Bash for macOS
        run: |
          bash_path=$(nix-build ./nix --attr bash --no-out-link)
          echo "$bash_path/bin" >> "$GITHUB_PATH"
      - uses: teamniteo/gha-actions/nix@7e90d58c2bbdc0c7d6f7395b9fb2c6ba641a6bd2 # v42
        with:
          auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate release tag
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["PASSLET_TAG"]), "Expected vX.Y.Z release tag"'
          echo "PASSLET_VERSION=${PASSLET_TAG#v}" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate and profile
        env:
          APPLICATION_CERTIFICATE_DATA: ${{ secrets.APPLICATION_CERTIFICATE_DATA }}
          APPLICATION_CERTIFICATE_PASSPHRASE: ${{ secrets.APPLICATION_CERTIFICATE_PASSPHRASE }}
          PROVISIONING_PROFILE_DATA: ${{ secrets.PROVISIONING_PROFILE_DATA }}
        run: |
          set -eu
          umask 077
          keychain="$RUNNER_TEMP/passlet-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$APPLICATION_CERTIFICATE_DATA" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$PROVISIONING_PROFILE_DATA" | base64 --decode > "$RUNNER_TEMP/passlet.provisionprofile"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLICATION_CERTIFICATE_PASSPHRASE" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          echo "PASSLET_PROVISIONING_PROFILE=$RUNNER_TEMP/passlet.provisionprofile" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify
        env:
          PASSLET_SIGNING_IDENTITY: ${{ vars.PASSLET_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: make release
      - name: Attach signed release artifacts
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin "refs/tags/$PASSLET_TAG"
          current_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$current_sha" = "$VERIFIED_SHA"
          gh release upload "$PASSLET_TAG" dist/*
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/passlet-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/passlet.provisionprofile"
