name: Release metadata
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: passlet-release-metadata
  cancel-in-progress: false
jobs:
  update:
    if: github.event.workflow_run.conclusion == 'success' && endsWith(github.event.workflow_run.head_branch, '-prepare')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Add verified metadata to the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREPARATION_RUN: ${{ github.event.workflow_run.id }}
        run: python3 scripts/update-release-pr.py "$PREPARATION_RUN"
