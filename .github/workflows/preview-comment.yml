name: Preview download comment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: preview-comments
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # No checkout or artifact download: this privileged workflow only reads API metadata.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            if (run.repository.id !== context.payload.repository.id) return;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...repo, run_id: run.id, per_page: 100
            });
            const artifact = artifacts.find(a => a.name === 'Passlet-macOS-preview.zip' && !a.expired);
            if (!artifact) return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            const buildJob = jobs.find(j => j.name === 'Test (macos-15)');
            if (!buildJob) return;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...repo, commit_sha: run.head_sha, per_page: 100
            });
            const marker = '<!-- passlet-macos-preview -->';
            for (const candidate of prs) {
              const {data: pr} = await github.rest.pulls.get({...repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.base.repo.id !== run.repository.id ||
                  pr.head.sha !== run.head_sha || pr.head.repo?.id !== run.head_repository.id) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pr.number, per_page: 100
              });
              const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
              const priorRun = previous?.body.match(/<!-- passlet-preview-run:(\d+):(\d+) -->/);
              if (priorRun && (Number(priorRun[1]) > run.id ||
                  (Number(priorRun[1]) === run.id && Number(priorRun[2]) > run.run_attempt))) continue;
              const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`;
              const body = [
                marker,
                `<!-- passlet-preview-run:${run.id}:${run.run_attempt} -->`,
                `[Download the macOS app](${url}/artifacts/${artifact.id}) · [Build job](${buildJob.html_url})`,
                '',
                'This build is not Apple-signed, so protected Keychain access will not work.'
              ].join('\n');
              if (previous) {
                await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({...repo, issue_number: pr.number, body});
              }
            }
